name: Deploy attachment-gateway function

on:
  workflow_dispatch:

permissions:
  id-token: write      # required for OIDC federation to Azure
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # Azure OIDC trust is bound to this environment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Function code lives in gateway/ (this repo also hosts the add-in at root).
      - run: npm ci
        working-directory: gateway

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: func-attach-gateway-766
          package: gateway
          sku: flexconsumption
